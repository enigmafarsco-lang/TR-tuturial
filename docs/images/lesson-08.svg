<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect x="0" y="0" width="1200" height="360" rx="6" fill="#101f30"/><text x="600" y="36" text-anchor="middle" fill="#ebc379" font-size="22" font-family="DejaVu Sans,sans-serif">MINIMUM SIZE MUST NOT OVERRIDE THE RISK BUDGET</text><rect x="150" y="120" width="300" height="120" rx="6" fill="#24445c"/><text x="300" y="165" text-anchor="middle" fill="#dce8f0" font-size="21" font-family="DejaVu Sans,sans-serif">Raw allowed size: 8</text><text x="300" y="207" text-anchor="middle" fill="#dce8f0" font-size="21" font-family="DejaVu Sans,sans-serif">Instrument minimum: 10</text><path d="M470 180L680 180" stroke="#89aac2" stroke-width="3" stroke-dasharray=""/><rect x="710" y="120" width="320" height="120" rx="6" fill="#673f4b"/><text x="870" y="190" text-anchor="middle" fill="#dce8f0" font-size="21" font-family="DejaVu Sans,sans-serif">REJECT — do not round up</text><text x="600" y="338" text-anchor="middle" fill="#9db2c2" font-size="15" font-family="DejaVu Sans,sans-serif">ILLUSTRATION ONLY / SYNTHETIC VALUES / NOT A TRADING SIGNAL</text></svg>