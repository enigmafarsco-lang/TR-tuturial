<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect x="0" y="0" width="1200" height="360" rx="6" fill="#101f30"/><text x="600" y="36" text-anchor="middle" fill="#ebc379" font-size="22" font-family="DejaVu Sans,sans-serif">THE KILL SWITCH HAS DISTINCT, TESTABLE ACTIONS</text><rect x="80" y="100" width="280" height="130" rx="6" fill="#24445c"/><text x="220" y="173" text-anchor="middle" fill="#dce8f0" font-size="18" font-family="DejaVu Sans,sans-serif">Pause new entries</text><rect x="460" y="100" width="280" height="130" rx="6" fill="#5b4e35"/><text x="600" y="173" text-anchor="middle" fill="#dce8f0" font-size="18" font-family="DejaVu Sans,sans-serif">Manage pending</text><rect x="840" y="100" width="280" height="130" rx="6" fill="#673f4b"/><text x="980" y="173" text-anchor="middle" fill="#dce8f0" font-size="18" font-family="DejaVu Sans,sans-serif">Emergency exit</text><text x="600" y="290" text-anchor="middle" fill="#dce8f0" font-size="21" font-family="DejaVu Sans,sans-serif">Stopping a process does not automatically close a position</text><text x="600" y="338" text-anchor="middle" fill="#9db2c2" font-size="15" font-family="DejaVu Sans,sans-serif">ILLUSTRATION ONLY / SYNTHETIC VALUES / NOT A TRADING SIGNAL</text></svg>