<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img"><rect width="1100" height="650" rx="18" fill="#101f30"/><style>text{font-family:Tahoma,Arial,sans-serif;text-anchor:middle;fill:#e6edf4;font-size:20px}.small{font-size:16px;fill:#a9bbcc}</style><text x="550" y="48" fill="#ebc379">ATLAS / SYSTEM MAP</text><rect x="745" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="900" y="145" direction="rtl">۱ · داده و خبر</text><text class="small" x="900" y="190" direction="rtl">قیمت + منبع + زمان دریافت</text><rect x="395" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="550" y="145" direction="rtl">۲ · اعتبارسنجی</text><text class="small" x="550" y="190" direction="rtl">کیفیت داده و حذف تکرار</text><rect x="45" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="200" y="145" direction="rtl">۳ · تحلیل و پیشنهاد</text><text class="small" x="200" y="190" direction="rtl">قواعد / مدل؛ امکان عدم معامله</text><rect x="45" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="200" y="390" direction="rtl">۴ · دروازه ریسک</text><text class="small" x="200" y="435" direction="rtl">سقف مواجهه؛ مستقل از AI</text><rect x="395" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="550" y="390" direction="rtl">۵ · اجرای آزمایشی</text><text class="small" x="550" y="435" direction="rtl">سفارش یکتا و تطبیق وضعیت</text><rect x="745" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="900" y="390" direction="rtl">۶ · ژورنال و پایش</text><text class="small" x="900" y="435" direction="rtl">هشدار، ارزیابی و کلید توقف</text><g stroke="#ebc379" stroke-width="3" fill="none"><path d="M740 172H715l10 -7m-10 7 10 7M390 172H365l10 -7m-10 7 10 7M200 265V320l-7 -10m7 10 7 -10M365 417H390l-10 -7m10 7 -10 7M715 417H740l-10 -7m10 7 -10 7"/></g><text class="small" x="550" y="595" direction="rtl">پایش ۲۴ساعته ≠