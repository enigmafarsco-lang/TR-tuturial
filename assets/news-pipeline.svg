<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img"><rect width="1100" height="650" rx="18" fill="#101f30"/><style>text{font-family:Tahoma,Arial,sans-serif;text-anchor:middle;fill:#e6edf4;font-size:20px}.small{font-size:16px;fill:#a9bbcc}</style><text x="550" y="48" fill="#ebc379">NEWS / SYNTHETIC EXAMPLE</text><rect x="745" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="900" y="145" direction="rtl">۱ · دریافت پیام</text><text class="small" x="900" y="190" direction="rtl">نمونه ساختگی: شایعه تغییر نرخ</text><rect x="395" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="550" y="145" direction="rtl">۲ · ثبت زمان</text><text class="small" x="550" y="190" direction="rtl">انتشار، دریافت، منبع اولیه</text><rect x="45" y="95" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="200" y="145" direction="rtl">۳ · بررسی اعتبار</text><text class="small" x="200" y="190" direction="rtl">بدون تأیید مستقل؛ خبر تکراری</text><rect x="45" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="200" y="390" direction="rtl">۴ · خروجی مدل</text><text class="small" x="200" y="435" direction="rtl">رویداد نامعتبر؛ نه دستور اجرا</text><rect x="395" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="550" y="390" direction="rtl">۵ · تصمیم سیاست</text><text class="small" x="550" y="435" direction="rtl">NO_TRADE؛ سفارش تولید نشود</text><rect x="745" y="340" width="310" height="155" rx="16" fill="#172c40" stroke="#486176"/><text x="900" y="390" direction="rtl">۶ · ثبت علت</text><text class="small" x="900" y="435" direction="rtl">برای ارزیابی بعدی ذخیره شود</text><g stroke="#ebc379" stroke-width="3" fill="none"><path d="M740 172H715l10 -7m-10 7 10 7M390 172H365l10 -7m-10 7 10 7M200 265V320l-7 -10m7 10 7 -10M365 417H390l-10 -7m10 7 -10 7M715 417H740l-10 -7m10 7 -10 7"/></g><text class="small" x="550" y="595" direction="rtl">نظر، شایعه و خبر تأییدشده یکی نیستند؛ همه متن‌ها داده غیرقابل‌اعتمادند.</text></svg>